<!DOCTYPE html>
<!-- Hecho por Sebastián Poveda y Santiago Romero. 2026 -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Sebastián Poveda y Santiago Romero">
<meta name="copyright" content="© 2026 Sebastián Poveda y Santiago Romero">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuaderno de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Hecho por Sebastián Poveda y Santiago Romero. 2026 — Mi cuaderno de estudio · estilos */
:root{
  --bg:#f5f1e8;--c:#fffdf8;--t:#25211d;--m:#8a7f70;--a:#7a2e2c;--al:#f2e2dc;--b:#e6ddc9;--ok:#3f7d5c;--no:#a8433a;
  --serif:'Fraunces',Georgia,"Times New Roman",serif;--sans:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme=dark]{--bg:#1b1e24;--c:#242830;--t:#e7e9ec;--m:#9aa1ac;--a:#dc9c86;--al:#333944;--b:#343a45}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1e24;--c:#242830;--t:#e7e9ec;--m:#9aa1ac;--a:#dc9c86;--al:#333944;--b:#343a45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15.5px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:.4em 0;letter-spacing:-.01em}
h1{font-size:1.7em}h2{font-size:1.25em;color:var(--a)}h3{font-size:1.08em}
p.meta,small,.meta{color:var(--m)}
button{font:inherit;color:inherit;cursor:pointer;background:none}
input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 14%,transparent)}
textarea{min-height:110px;resize:vertical;font-family:inherit}
.pr{border:1px solid var(--a);background:var(--a);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600}
.sec{border:1px solid var(--b);background:transparent;border-radius:10px;padding:8px 14px;color:var(--t)}
.sec:hover,.pr:hover{filter:brightness(1.05)}
.icon-btn{border:1px solid var(--b);background:transparent;border-radius:50%;width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--al);border-color:var(--a)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.two{grid-template-columns:1fr}}
.lbl{display:block;font-size:.82em;color:var(--m);margin:10px 0 4px;font-weight:600}
.fld{margin-bottom:6px}
.viewhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}
.bar{height:9px;background:var(--b);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--a);transition:width .3s}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--b);padding:9px 0}
.li:last-child{border-bottom:0}
.s{background:var(--c);border:1px solid var(--b);border-radius:14px;margin-bottom:12px;overflow:hidden}
.s summary{cursor:pointer;padding:13px 16px;font-weight:600;font-family:var(--serif);font-size:1.05em;display:flex;justify-content:space-between;align-items:center;list-style:none}
.s summary::-webkit-details-marker{display:none}
.s>.b{padding:0 16px 16px}
.matCard{display:flex;flex-direction:column}
.matCard .row{margin-top:auto}
.corteRow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.corteRow .fld.sm{flex:2}.corteRow .fld.xs{flex:1;min-width:0}
.cardRow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cardRow .fld.sm{flex:1;margin-bottom:0}
.temaList details{background:var(--bg)}
.secAcc{background:var(--c);border:1px solid var(--b);border-radius:16px;margin:10px 0;overflow:hidden;transition:border-color .2s}
.secAcc[open]{border-color:var(--a)}
.secAcc>summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--serif);font-size:1.05em;font-weight:500}
.secAcc>summary::-webkit-details-marker{display:none}
.secAcc>summary::after{content:'+';color:var(--a);font-size:1.5em;line-height:1;font-family:var(--sans);transition:transform .2s}
.secAcc[open]>summary::after{transform:rotate(45deg)}
.secAcc>summary .sn{flex:1}
.secAcc>.b{padding:0 18px 18px}
.secAcc textarea{min-height:130px}
.secTools{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.secTools .fld{margin-bottom:0}
.temaTitleBig{font-family:var(--serif);font-size:1.5em;font-weight:500}
.pfhero{display:flex;align-items:center;gap:14px}
.pfav{width:56px;height:56px;border-radius:50%;background:var(--al);display:flex;align-items:center;justify-content:center;font-size:1.6em;flex:none}
.pgs{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.pgs div{font-size:.85em;color:var(--m)}.pgs b{display:block;font-size:1.3em;color:var(--t);font-family:var(--serif)}
.avatarPicker{display:flex;flex-wrap:wrap;gap:6px}
.avBtn{border:2px solid var(--b);background:var(--c);border-radius:10px;width:42px;height:42px;font-size:1.2em}
.avBtn.on{border-color:var(--a);background:var(--al)}
.empty{border:1px dashed var(--b);border-radius:14px;padding:24px;text-align:center;color:var(--m)}

/* Study tools */
.toolGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0 4px}
.flashcard{perspective:1200px;height:220px;margin:18px 0;cursor:pointer}
.fcInner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flip .fcInner{transform:rotateY(180deg)}
.fcFace{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:16px;border:1px solid var(--b);background:var(--c);font-family:var(--serif);font-size:1.25em;overflow:auto}
.fcBack{transform:rotateY(180deg);background:var(--al)}
.optBtn{display:block;width:100%;text-align:left;margin-bottom:8px}
.optBtn.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.optBtn.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,transparent)}
.optBtn.chosen{border-color:var(--a);background:var(--al)}
.optBtn:disabled{cursor:default;opacity:.9}
/* Hecho por Sebastián Poveda y Santiago Romero. 2026 — Mi cuaderno de estudio · estilos */

/* Auth screen */
#authScreen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--al) 55%,var(--bg)),var(--bg))}
#authScreen[hidden]{display:none}
.authCard{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:28px 26px;max-width:380px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.25)}
.authCard h1{text-align:center;margin-bottom:2px}
.authCard>p.meta{text-align:center;margin-top:0}
.authTabs{display:flex;gap:6px;background:var(--bg);border-radius:10px;padding:4px;margin:16px 0}
.authTabs button{flex:1;padding:8px;border-radius:8px;font-weight:600;color:var(--m)}
.authTabs button.on{background:var(--a);color:#fff}
#authForm input{margin-bottom:10px}
#authForm .pr{width:100%}
.authError{background:#a8433a20;color:var(--no);border-radius:10px;padding:10px 12px;font-size:.9em;margin-top:12px}
#authLoading{text-align:center;margin-top:12px}

/* Header / nav */
header#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:8px;align-items:center;padding:10px 14px;background:color-mix(in srgb,var(--c) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
header#topbar b{font-family:var(--serif);font-size:1.1em;white-space:nowrap}
#searchWrap{position:relative;flex:1;min-width:0}
#searchBox{border-radius:999px;padding:9px 16px}
#searchResults{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--c);border:1px solid var(--b);border-radius:12px;max-height:60vh;overflow:auto;z-index:20;box-shadow:0 14px 30px -14px rgba(0,0,0,.3)}
#searchResults:empty{display:none}
#searchResults div{padding:10px 14px;border-bottom:1px solid var(--b);cursor:pointer}
#searchResults div:last-child{border-bottom:0}
#searchResults div:hover{background:var(--al)}
nav#mainNav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b)}
nav#mainNav button{white-space:nowrap;border:0;padding:8px 16px;border-radius:999px;color:var(--m);font-weight:600}
nav#mainNav button.on{background:var(--al);color:var(--a)}
main#view{max-width:900px;margin:0 auto;padding:20px 16px 70px;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Calendar */
.calNav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.calGrid .dh{text-align:center;font-size:.75em;color:var(--m);font-style:normal}
.dcell{aspect-ratio:1;border:1px solid var(--b);border-radius:8px;background:var(--c);position:relative;font-size:.85em}
.dcell.empty{border:0;background:transparent}
.dcell.today{border-color:var(--a);font-weight:700}
.dcell.sel{background:var(--al);border-color:var(--a)}
.dcell .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--a)}

/* ===== Mejora estética de temas y tarjetas (solo diseño) ===== */
.temaList{display:flex;flex-direction:column;gap:16px}
.temaList>.s{background:var(--c);margin-bottom:0;border-radius:18px;box-shadow:0 14px 30px -24px rgba(60,40,20,.45)}
.temaList>.s>summary{padding:18px 20px;gap:14px}
.temaList>.s>.b{padding:4px 20px 22px}
.temaHead{display:flex;flex-direction:column;gap:8px;min-width:0}
.temaHead .tt{font-size:1.12em;font-weight:500;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .72em/1 var(--sans);color:var(--m);background:var(--bg);border:1px solid var(--b);border-radius:999px;padding:5px 10px}
.tituloTema{font-family:var(--serif);font-size:1.4em;font-weight:500;border:0;border-bottom:1px solid var(--b);border-radius:0;background:transparent;padding:10px 2px;margin-bottom:16px}
.tituloTema:focus{box-shadow:none;border-bottom-color:var(--a)}
.resumenCard{background:var(--al);border-radius:14px;padding:14px 18px;margin:0 0 16px}
.resumenCard small{font-weight:600;color:var(--a)}
.resumenCard p{margin:4px 0 0;font-family:var(--serif);line-height:1.7}
.secList{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.temaList .secAcc{background:var(--bg);margin:0;border-radius:14px;border:1px solid var(--b);border-left:4px solid var(--a)}
.temaList .secAcc>summary{padding:14px 18px}
.temaList .secAcc>.b{padding:2px 18px 18px}
.secAcc .sn{display:flex;flex-direction:column;gap:3px;min-width:0}
.secAcc .st{font-weight:500}
.secAcc .sp{color:var(--m);font:400 .82em/1.45 var(--sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.secAcc[open] .sp{display:none}
.secAcc .secTools{margin-bottom:12px}
.secAcc .secTools input{border:0;border-bottom:1px solid var(--b);border-radius:0;background:transparent;padding:6px 2px;font-family:var(--serif);font-size:1.05em;font-weight:500}
.secAcc .secTools input:focus{box-shadow:none;border-bottom-color:var(--a)}
.secAcc textarea{background:var(--c);padding:14px 16px;line-height:1.75;min-height:96px;overflow:hidden;resize:none}
.cardList{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0 14px}
.cardList>p.meta{grid-column:1/-1}
.cardRow{position:relative;flex-direction:column;align-items:stretch;gap:6px;margin:0;padding:14px;background:var(--bg);border:1px solid var(--b);border-radius:14px}
.cardRow .cl{font-size:.7em;font-weight:600;color:var(--m)}
.cardRow .fld.sm{flex:none;width:100%;margin-bottom:6px}
.cardRow .cf{font-family:var(--serif);font-weight:500}
.cardRow .icon-btn{position:absolute;top:8px;right:8px;width:30px;height:30px}

/* ===== Pestañas del tema, lectura limpia y esquema ===== */
.tabsT{display:flex;gap:4px;margin:0 0 18px;border-bottom:1px solid var(--b);overflow-x:auto}
.tabsT button{display:flex;align-items:center;gap:6px;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;font-weight:600;color:var(--m);white-space:nowrap}
.tabsT button.on{color:var(--a);border-bottom-color:var(--a)}
.tp[hidden]{display:none}
.tarjIntro{margin:0 0 4px}
.secAcc .secEdit{display:none}
.secAcc.editing .secEdit{display:block}
.secAcc.editing .secRead{display:none}
.secAcc .lbEdit{display:none}
.secAcc.editing .lbRead{display:none}
.secAcc.editing .lbEdit{display:inline}
.secEdit .fld{margin-bottom:8px}
.secEdit input.fld{font-family:var(--sans);font-size:1em;border:1px solid var(--b);border-radius:10px;background:var(--bg);padding:9px 12px}
.secFoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.secRead .txt{max-width:68ch}
.secRead .txt p{margin:0 0 .9em;line-height:1.8}
.secRead .txt ul.lista{margin:0 0 .9em;padding-left:1.2em;line-height:1.8}
.secRead .txt ul.lista li{margin-bottom:.35em}
.secRead .txt ul.lista li::marker{color:var(--a)}
.puntos{background:var(--al);border-radius:12px;padding:14px 18px;margin-top:6px}
.puntos small{font-weight:600;color:var(--a)}
.puntos ul{margin:6px 0 0;padding-left:1.1em}
.puntos li{line-height:1.6;margin-bottom:4px}
.puntos li::marker{color:var(--a)}
/* Hecho por Sebastián Poveda y Santiago Romero. 2026 · esquemas */
/* ===== Esquemas: ramificado, radial y matricial ===== */
.esqx{--esqL:color-mix(in srgb,var(--m) 45%,transparent)}
.esqx-bar{margin:0 0 16px;position:relative;z-index:5}
.esqx-tabs{position:relative;display:inline-block}
.esqx-tab{display:inline-flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid var(--b);border-radius:12px;background:var(--bg);color:var(--t);font-weight:600}
.esqx-tab:hover{border-color:var(--a)}
.esqx-cur{color:var(--m);font-weight:400;font-size:.9em}
.esqx-chev{width:14px;height:14px;color:var(--a);transition:transform .2s ease}
.esqx-tab[aria-expanded="true"] .esqx-chev{transform:rotate(180deg)}
.esqx-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;margin:0;padding:6px;list-style:none;background:var(--c);border:1px solid var(--b);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.3);z-index:20}
.esqx-menu[hidden]{display:none}
.esqx-mi{display:grid;grid-template-columns:28px 1fr;align-items:center;column-gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;text-align:left}
.esqx-mi:hover,.esqx-mi:focus-visible{background:var(--al)}
.esqx-ico{width:24px;height:24px;color:var(--m)}
.esqx-nm{display:block;font-weight:600}
.esqx-ds{display:block;font-size:.85em;color:var(--m)}
.esqx-mi[aria-checked="true"] .esqx-nm,.esqx-mi[aria-checked="true"] .esqx-ico{color:var(--a)}
.esqx-anim{animation:esqIn .28s ease both}
@keyframes esqIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* tipos de idea */
.esqx-t-definicion{--tc:var(--a)}
.esqx-t-caracteristica{--tc:#5b8db8}
.esqx-t-ejemplo{--tc:#4e9a73}
.esqx-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 16px;font-size:.8rem;color:var(--m)}
.esqx-lg{display:inline-flex;align-items:center;gap:6px}
.esqx-lg i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.esqx-tag{font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tc)}
.esqx-term{font-family:var(--serif);font-weight:600;color:var(--t)}
/* ramificado */
.esqx-root{display:inline-block;max-width:100%;padding:12px 26px;background:var(--a);color:var(--bg);border-radius:14px;font:600 1.15rem/1.3 var(--serif)}
.esqx-cats{margin-left:26px}
.esqx-cat{--pt:20px;position:relative;padding:var(--pt) 0 6px 32px}
.esqx-cat::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--esqL)}
.esqx-cat:last-child::before{bottom:auto;height:calc(var(--pt) + 20px)}
.esqx-cat::after{content:"";position:absolute;left:0;top:calc(var(--pt) + 20px);width:28px;border-top:1.5px solid var(--esqL)}
.esqx-catnode{display:inline-flex;align-items:center;gap:10px;min-height:40px;max-width:100%;padding:6px 18px 6px 8px;background:var(--al);border:1px solid var(--a);border-radius:12px;color:var(--a);font:600 1.02rem/1.3 var(--serif)}
.esqx-num{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--a);color:var(--bg);font:700 .8rem var(--sans)}
.esqx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.esqx-card{display:flex;flex-direction:column;gap:3px;padding:10px 14px 12px 14px;background:var(--bg);border:1px solid var(--b);border-left:4px solid var(--tc);border-radius:12px;font-size:.92rem;line-height:1.45}
.esqx-card .esqx-term{font-size:1rem;line-height:1.3}
.esqx-desc{color:var(--t)}
/* radial */
.esqx-scroll{overflow-x:auto;padding-bottom:8px}
.esqx-fit{position:relative;margin:0 auto}
.esqx-stage{position:relative;transform-origin:0 0}
.esqx-stage:not(.laid):not(.stacked){visibility:hidden;min-height:320px}
.esqx-lines{position:absolute;left:0;top:0;pointer-events:none}
.esqx-lines line{stroke:var(--a);stroke-opacity:.45;stroke-width:1.5;stroke-linecap:round}
.esqx-center{position:absolute;width:220px;padding:16px 18px;background:var(--a);color:var(--bg);border-radius:20px;box-shadow:0 0 0 8px color-mix(in srgb,var(--a) 14%,transparent);font:600 1.12rem/1.3 var(--serif);text-align:center}
.esqx-rcard{position:absolute;width:240px;padding:12px 14px;background:var(--bg);border:1px solid var(--b);border-radius:16px}
.esqx-rtitle{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid color-mix(in srgb,var(--a) 45%,transparent);color:var(--a);font:600 .95rem/1.3 var(--serif)}
.esqx-chips{display:flex;flex-wrap:wrap;gap:6px}
.esqx-chip{padding:3px 10px;border-radius:12px;border:1px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--t);font-size:.78rem;font-weight:600;line-height:1.4}
.esqx-stage.stacked{display:flex;flex-direction:column;align-items:center;width:auto!important;height:auto!important;transform:none!important}
.esqx-stage.stacked .esqx-lines{display:none}
.esqx-stage.stacked .esqx-center,.esqx-stage.stacked .esqx-rcard{position:relative;left:auto!important;top:auto!important;width:100%;max-width:460px}
.esqx-stage.stacked .esqx-rcard{margin-top:30px}
.esqx-stage.stacked .esqx-rcard::before{content:"";position:absolute;left:50%;top:-30px;height:30px;border-left:1.5px solid color-mix(in srgb,var(--a) 45%,transparent)}
/* matricial */
.esqx-tscroll{overflow-x:auto}
.esqx-matriz{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--bg);font-size:.9rem}
.esqx-matriz caption{caption-side:top;padding:0 0 14px;text-align:left;color:var(--a);font:600 1.15rem var(--serif)}
.esqx-matriz th,.esqx-matriz td{padding:14px 14px;vertical-align:top;text-align:left;border-bottom:1px solid var(--b);border-right:1px solid var(--b);overflow-wrap:anywhere}
.esqx-matriz thead th{background:var(--c);color:var(--a);font:600 .95rem var(--serif);border-top:1px solid var(--b);border-bottom:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.esqx-matriz thead th:first-child{width:21%;border-top-left-radius:14px;border-left:1px solid var(--b)}
.esqx-matriz thead th:nth-child(2){width:27%}
.esqx-matriz thead th:nth-child(3){width:32%}
.esqx-matriz thead th:nth-child(4){width:20%}
.esqx-matriz thead th:last-child{border-top-right-radius:14px}
.esqx-matriz tbody th[scope="row"]{background:var(--c);color:var(--a);font:600 .98rem var(--serif);border-left:1px solid var(--b)}
.esqx-matriz tbody tr:last-child th{border-bottom-left-radius:14px}
.esqx-matriz tbody tr:last-child td:last-child{border-bottom-right-radius:14px}
.esqx-matriz td p{margin:0}
.esqx-matriz td ul{margin:0;padding-left:18px}
.esqx-matriz td li{margin:0 0 7px;line-height:1.45}
.esqx-matriz td li:last-child{margin-bottom:0}
.esqx-matriz td li::marker{color:var(--a)}
.esqx-matriz .esqx-term{display:block}
.esqx-matriz .vacio{color:var(--m)}
.esqx-mcards{display:none;flex-direction:column;gap:14px}
.esqx-mc{background:var(--bg);border:1px solid var(--b);border-radius:16px;padding:14px}
.esqx-mc .esqx-catnode{margin-bottom:10px}
.esqx-mrow{margin-top:10px;padding:8px 12px 10px;border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 7%,transparent);border-radius:0 10px 10px 0}
.esqx-mrow p{margin:4px 0 0;font-size:.92rem;line-height:1.45}
.esqx-mrow ul{margin:4px 0 0;padding-left:18px;font-size:.92rem}
.esqx-mrow li{margin:0 0 6px;line-height:1.45}
.esqx-mrow li:last-child{margin-bottom:0}
.esqx-mrow .esqx-term{display:block}
@media(max-width:700px){

  .esqx-mcards{display:flex}
}
@media(max-width:620px){
  .esqx-root{font-size:1.02rem;padding:10px 18px}

  .esqx-cat{padding-left:18px}
  .esqx-cat::after{width:14px}
  .esqx-grid{grid-template-columns:1fr}
  .esqx-catnode{font-size:.98rem}
  .esqx-menu{min-width:min(270px,calc(100vw - 60px))}
}

/* Hecho por Sebastián Poveda y Santiago Romero. 2026 · cortes y carpetas */
/* ===== Cortes como carpetas ===== */
select.fld{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:9px 12px;width:100%}
.folder{background:var(--c);border:1px solid var(--b);border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:0 14px 30px -24px rgba(60,40,20,.45)}
.folder[open]{border-color:color-mix(in srgb,var(--a) 55%,var(--b))}
.folder>summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.folder>summary::-webkit-details-marker{display:none}
.fHead{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.fHead .ft{font-family:var(--serif);font-size:1.2em;font-weight:500;line-height:1.3}
.fAct{display:flex;gap:6px;flex:none}
.folder>.b{padding:2px 18px 20px}
.chipOk{color:var(--ok);border-color:var(--ok)}
.corteEdit{display:none;background:var(--bg);border:1px solid var(--b);border-radius:14px;padding:6px 14px 12px;margin:0 0 16px}
.folder.editing .corteEdit{display:block}
.corteGrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:560px){.corteGrid{grid-template-columns:1fr 1fr}.corteGrid>:first-child{grid-column:1/-1}}
.goalBar{position:relative;height:12px}
.goalMark{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;background:var(--t);opacity:.75;border-radius:2px}

/* ===== Tarjetas legibles: el texto completo se ve, sin cortes ===== */
.cardList{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cardRow{padding:16px 16px 12px}
.cardRow textarea.fld.sm{min-height:46px;height:auto;resize:none;overflow:hidden;line-height:1.5;padding:10px 12px;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.cardRow textarea.cf{font-family:var(--serif);font-weight:600;font-size:1.05em;line-height:1.4;padding-right:44px}
.cardRow textarea.cb{font-size:.95em;color:var(--t)}
.cardRow .cl{letter-spacing:.04em;text-transform:uppercase}

/* ===== Acceso con Google y materias compartidas ===== */
.googleBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--b);background:var(--c);border-radius:10px;padding:10px 14px;font-weight:600;margin-top:16px}
.googleBtn:hover{background:var(--al)}
.googleBtn:disabled{opacity:.6;cursor:wait}
.authSep{display:flex;align-items:center;gap:10px;color:var(--m);font-size:.82em;margin:14px 0 0}
.authSep:before,.authSep:after{content:"";flex:1;height:1px;background:var(--b)}
.shareBox .members{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.shareBox code{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:3px 8px;font-size:.85em;word-break:break-all}
.shareBox .row{flex-wrap:wrap}
/* ===== Rachas, estampillas y Camino al éxito ===== */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;background:var(--c);color:var(--t);border:1px solid var(--a);border-radius:14px;padding:12px 18px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:9999;transition:all .35s;text-align:center;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rTop{display:flex;align-items:center;gap:14px}
.rNum{font:700 2.4em/1 inherit;color:var(--a)}
.strip{display:flex;gap:5px;margin:14px 0 12px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--b);display:grid;place-items:center;font-size:.68em;color:var(--m);background:var(--bg)}
.dot.on{background:var(--a);color:var(--c);border-color:var(--a)}
.dot.hoy{outline:2px solid var(--a);outline-offset:2px}
.badgeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badgeC{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.badgeC small{color:var(--m);line-height:1.35}
.badgeC .bIcon{font-size:2em}
.badgeC.lock{opacity:.55;filter:grayscale(1)}
.premio{margin:14px auto;max-width:420px;text-align:left}
.path{position:relative;margin-top:16px;padding-left:6px}
.path:before{content:"";position:absolute;left:23px;top:10px;bottom:30px;width:3px;background:var(--b);border-radius:3px}
.stage{display:flex;gap:14px;margin-bottom:16px;position:relative}
.node{flex:0 0 36px;height:36px;border-radius:50%;background:var(--bg);border:3px solid var(--b);display:grid;place-items:center;font-weight:700;color:var(--m);z-index:1}
.stage.hecha .node{background:var(--ok);border-color:var(--ok);color:#fff}
.stage.actual .node{background:var(--a);border-color:var(--a);color:var(--c)}
.stage.pend .stCard{opacity:.78}
.stCard{flex:1;min-width:0}
.stHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.obj{display:flex;gap:10px;margin-top:10px;align-items:flex-start}
.obj .oi{font-size:1.2em}
.obj.ok b{color:var(--ok)}
.tipoT{color:var(--m);font-weight:600;text-transform:uppercase;font-size:.62em;letter-spacing:.04em;margin-left:4px}
.bar.mini{height:5px;margin:5px 0 0;max-width:220px}
.reward{margin-top:12px;font-size:.88em;font-weight:600;color:var(--ok)}
.reward.lock{color:var(--m);font-weight:400}
/* ===== Elección de rol ===== */
.rolOverlay{position:fixed;inset:0;z-index:10000;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;overflow:auto}
.rolBox{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:28px 24px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.rolLogo{font-size:2.6em;margin-bottom:4px}
.rolGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:520px){.rolGrid{grid-template-columns:1fr}}
.rolOpt{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--b);border-radius:16px;padding:20px 14px;cursor:pointer;color:var(--t);text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s}
.rolOpt span{font-size:2.4em}
.rolOpt small{color:var(--m);line-height:1.35;font-size:.8em}
.rolOpt:hover{border-color:var(--a);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.15)}
@media (prefers-reduced-motion:no-preference){
  @keyframes anRolIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
  .rolBox{animation:anRolIn .45s cubic-bezier(.2,.8,.2,1) both}
  .rolOpt{animation:anRolIn .5s cubic-bezier(.2,.8,.2,1) both}
  .rolOpt:nth-child(2){animation-delay:.1s}
}
/* ===== Animaciones y feedback ===== */
.optBtn{transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}
.qCard.answered .optBtn:not(.ok):not(.no):not(.chosen){opacity:.5}
.optBtn.ok::after{content:"✓";float:right;font-weight:800}
.optBtn.no::after{content:"✗";float:right;font-weight:800}
.optBtn.chosen::after{content:"●";float:right;color:var(--a)}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600}
.fbOk{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border:1px solid var(--ok)}
.fbNo{background:color-mix(in srgb,var(--no) 14%,transparent);color:var(--no);border:1px solid var(--no)}
.fbNo span{display:block;font-weight:400;color:var(--t);margin-top:4px}
.comboChip{display:inline-block;background:var(--al);color:var(--a);border:1px solid var(--a);border-radius:999px;padding:5px 12px;font-weight:700;margin-bottom:10px}
.toggleChip{font:600 .78em/1 var(--sans);color:var(--m);background:var(--bg);border:1px solid var(--b);border-radius:999px;padding:7px 12px;cursor:pointer;margin-bottom:10px}
.toggleChip.on{color:var(--a);border-color:var(--a);background:var(--al)}
.toggleChip:disabled{opacity:.5;cursor:default}
.ringWrap{position:relative;width:150px;height:150px;margin:6px auto 4px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.rbg{stroke:var(--b)}
.rfg{stroke:var(--a);stroke-dasharray:327px;stroke-dashoffset:calc(327px - 327px*var(--p)/100)}
.ringWrap.alto .rfg{stroke:var(--ok)}
.ringWrap.bajo .rfg{stroke:var(--no)}
.ringTxt{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:50px}
.ringTxt b{font-size:2.3em;line-height:1}
.ringTxt span{color:var(--m)}
.resMsg{font-weight:700;font-size:1.1em;margin:6px 0 2px}
.resList{max-width:520px;margin:14px auto;text-align:left}
.resRow{border-left:3px solid var(--b);padding-left:10px}
.resRow.bien{border-color:var(--ok)}
.resRow.mal{border-color:var(--no)}
.spark{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:9999}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:9999}
.rNum{display:inline-block}
@media (prefers-reduced-motion:no-preference){
  @keyframes anFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes anPop{0%{transform:scale(1)}40%{transform:scale(1.05)}70%{transform:scale(.99)}100%{transform:scale(1)}}
  @keyframes anGlowOk{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}

  @keyframes anFlashOk{0%{background:color-mix(in srgb,var(--ok) 50%,transparent)}100%{background:color-mix(in srgb,var(--ok) 16%,transparent)}}
  @keyframes anFlashNo{0%{background:color-mix(in srgb,var(--no) 45%,transparent)}100%{background:color-mix(in srgb,var(--no) 16%,transparent)}}
  @keyframes anRipple{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
  @keyframes anSlideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes anSlideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes anSpark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  @keyframes anFall{to{transform:translateY(105vh) rotate(720deg)}}
  @keyframes anRing{from{stroke-dashoffset:327px}}
  @keyframes anGrow{from{width:0}}
  @keyframes anGrowQ{from{width:var(--from)}}
  @keyframes anFlame{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
  @keyframes anBadge{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}

  #view.vIn>*{animation:anFadeUp .4s ease both}
  #view.vIn>*:nth-child(2){animation-delay:.05s}

  button{transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
  button.sec:not(:disabled):active,button.pr:not(:disabled):active{transform:scale(.97)}
  .grid>.card{transition:transform .2s,box-shadow .2s,border-color .2s}

  .fb{animation:anSlideDown .35s ease both}

}

const CORTES_DEFECTO=[['Corte 1',30],['Corte 2',30],['Corte 3',40]];
/* Garantiza: escala de notas, al menos un corte por materia y que cada tema esté dentro de un corte. */
function ensureCortes(){
  let changed=false;
  const pf=state.profile=state.profile||{};
  if(pf.scale==null){const g=+pf.goal;pf.scale=g>10?100:(g>5?10:5);changed=true}
  if(!(+pf.goal>=0)){pf.goal=pf.scale===100?80:(pf.scale===10?8:4);changed=true}
  state.cortes=state.cortes||[];state.temas=state.temas||[];
  (state.materias||[]).forEach(m=>{
    let cs=state.cortes.filter(c=>c.materiaId===m.id);
    if(!cs.length){
      CORTES_DEFECTO.forEach(([name,weight])=>state.cortes.push({id:uid(),materiaId:m.id,name,weight,score:null}));
      cs=state.cortes.filter(c=>c.materiaId===m.id);changed=true;
    }
    const ids=new Set(cs.map(c=>c.id));
    state.temas.forEach(t=>{if(t.materiaId===m.id&&!ids.has(t.corteId)){t.corteId=cs[0].id;changed=true}});
  });
  return changed;
}
function normalizeState(){
  if(ensureCortes())scheduleCloud();
  state.cards=state.cards||[];
  state.attempts=state.attempts||[];
  state.events=state.events||[];
  (state.materias||[]).forEach(m=>{if(m.refs==null)m.refs=''});
  state.cards.forEach(c=>{if(c.known===undefined)c.known=null});
  sembrarProgreso();
}

function localKey(){return 'cuaderno_'+(currentUid||'anon')}
function saveLocal(){try{localStorage.setItem(localKey(),JSON.stringify(state))}catch(e){}}
function loadLocal(){try{const raw=localStorage.getItem(localKey());return raw?JSON.parse(raw):null}catch(e){return null}}

let cloudTimer=null;
function scheduleCloud(){
  if(!currentUid)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(pushCloudNow,1000);
}
async function pushCloudNow(){
  if(!currentUid)return;
  pushShared();
  try{
    await db.collection('users').doc(currentUid).set({
      data:JSON.stringify(state),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){console.error('No se pudo sincronizar con la nube:',e)}
}
async function hydrateFromCloud(u){
  currentUid=u;
  try{
    const doc=await db.collection('users').doc(u).get();
    if(doc.exists && doc.data().data){
      state=JSON.parse(doc.data().data);
    }else{
      state=loadLocal()||defaultState();
      await pushCloudNow();
    }
  }catch(e){
    console.error('No se pudo leer la nube, uso datos locales:',e);
    state=loadLocal()||defaultState();
  }
  normalizeState();
  saveLocal();
}

/* mutate(): cambio estructural -> guarda + sincroniza + vuelve a pintar */
function mutate(fn){fn(state);ensureCortes();saveLocal();scheduleCloud();render()}
/* persist(): cambio de texto (inputs) -> guarda + sincroniza SIN repintar, para no perder el foco */
function persist(){saveLocal();scheduleCloud()}

function mapAuthError(err){
  const c=err&&err.code||'';
  const M={
    'auth/invalid-email':'Ese correo no es válido.',
    'auth/user-not-found':'No existe una cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/email-already-in-use':'Ya existe una cuenta con ese correo. Prueba iniciar sesión.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests':'Demasiados intentos. Espera un momento e inténtalo de nuevo.',
    'auth/network-request-failed':'Sin conexión a internet.',
    'auth/unauthorized-domain':'Este dominio no está autorizado en Firebase (Authentication > Settings > Authorized domains).',
    'auth/operation-not-allowed':'El acceso con Google no está activado en Firebase (Authentication > Sign-in method).',
    'auth/account-exists-with-different-credential':'Ya existe una cuenta con ese correo usando otro método de acceso.',
    'auth/popup-blocked':'El navegador bloqueó la ventana de Google. Permite las ventanas emergentes e inténtalo de nuevo.'
  };
  return M[c]||'Ocurrió un error. Inténtalo de nuevo.';
}
$('authForm').addEventListener('submit',async e=>{

/* Acceso con Google (ventana emergente; si el navegador la bloquea, se usa redirección) */
$('googleBtn').addEventListener('click',async()=>{
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  $('authError').hidden=true;$('googleBtn').disabled=true;
  try{
    await auth.signInWithPopup(provider);
  }catch(err){
    const c=err&&err.code||'';
    if(c==='auth/popup-blocked'){try{await auth.signInWithRedirect(provider);return}catch(e2){err=e2}}
    if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request'){
      console.error('Google:',err);
      $('authError').textContent=mapAuthError(err);$('authError').hidden=false;
    }
  }finally{
    $('googleBtn').disabled=false;
  }
});

/* ================= HELPERS DE DATOS ================= */
const scaleMax=()=>+(state.profile&&state.profile.scale)||5;
function fmtN(n){return(+n).toLocaleString('es',{minimumFractionDigits:0,maximumFractionDigits:scaleMax()>10?1:2})}
function corteStats(cortes){
  const scale=scaleMax(),goal=clamp(+state.profile.goal||0,0,scale);
  const W=cortes.reduce((a,c)=>a+(+c.weight||0),0);
  const scored=cortes.filter(c=>c.score!=null&&c.score!=='');
  const Ws=scored.reduce((a,c)=>a+(+c.weight||0),0);
  const sum=scored.reduce((a,c)=>a+(+c.score)*(+c.weight||0),0);
  const acum=W>0?sum/W:0;
  const avg=Ws>0?sum/Ws:null;
  const remW=W>0?(W-Ws)/W:0;
  const need=remW>0.0001?(goal-acum)/remW:null;
  return{scale,goal,W,Ws,acum,avg,remW,need,n:scored.length};
}
function weightedAvg(cortes){
  const scored=cortes.filter(c=>c.score!=null && c.score!=='');
  const totalW=scored.reduce((a,c)=>a+(+c.weight||0),0);
  if(!scored.length||!totalW)return null;
  const sum=scored.reduce((a,c)=>a+(+c.score)*(+c.weight),0);
  return sum/totalW;
}

function corteAvgHTML(cortes){
  const k=corteStats(cortes);
  const pct=k.avg==null?0:clamp(k.avg/k.scale*100,0,100);
  const gpct=clamp(k.goal/k.scale*100,0,100);
  const ok=k.avg!=null&&k.avg>=k.goal;
  let msg='';
  if(k.W<=0)msg='Asigna un peso (%) a tus cortes para calcular el promedio.';
  else if(k.need==null)msg=k.acum>=k.goal-1e-9?'🎉 Cumpliste tu meta.':'No alcanzaste la meta de '+fmtN(k.goal)+'.';
  else if(k.need<=0)msg='🎉 Ya aseguraste tu meta, aunque sacaras 0 en lo que falta.';
  else if(k.need>k.scale+1e-9)msg='Con lo que falta ya no alcanzas la meta (necesitarías '+fmtN(Math.ceil(k.need*100)/100)+' y el máximo es '+fmtN(k.scale)+').';
  else msg='Necesitas sacar al menos <b>'+fmtN(Math.ceil(k.need*100)/100)+'</b> de promedio en lo que falta ('+Math.round(k.remW*100)+'% restante) para llegar a tu meta.';
  const warn=k.W>0&&Math.abs(k.W-100)>0.01?`<p class="meta" style="color:var(--no)">⚠️ Los pesos suman ${fmtN(k.W)}%, deberían sumar 100%.</p>`:'';
  return `<div class="bar goalBar"><i style="width:${pct}%;background:${ok?'var(--ok)':'var(--a)'}"></i><span class="goalMark" style="left:${gpct}%" title="Meta"></span></div>
  <p class="meta" style="margin:6px 0">${k.avg==null?'Registra la nota de un corte para ver tu promedio.':`Promedio de lo evaluado: <b style="color:${ok?'var(--ok)':'var(--t)'}">${fmtN(k.avg)}</b> / ${fmtN(k.scale)} · meta ${fmtN(k.goal)}`}</p>
  <p class="meta" style="margin:0">${msg}</p>${warn}`;
}

  const out=puntosDe(sc).map((texto,i)=>({texto,tipo:ESQ_TIPOS.includes(tp[i])?tp[i]:null}));

/* Vista radial: ramas en círculo, sin superposiciones, y se reduce la escala para que SIEMPRE quepa en el panel. */
function esqChocan(a,b,g){return a.x-g<b.x+b.w&&b.x-g<a.x+a.w&&a.y-g<b.y+b.h&&b.y-g<a.y+a.h}
function layoutRadial(stage){
  const fit=stage.parentElement,wrap=fit.parentElement;
  const svg=stage.querySelector('.esqx-lines'),center=stage.querySelector('.esqx-center'),cards=[...stage.querySelectorAll('.esqx-rcard')];
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  const avail=wrap.clientWidth;
  stage.style.transform='';fit.style.width='';fit.style.height='';
  if(avail&&avail<560){stage.classList.add('stacked','laid');stage.style.width='';stage.style.height='';return}

  const cw=center.offsetWidth,ch=center.offsetHeight,sizes=cards.map(c=>({w:c.offsetWidth,h:c.offsetHeight})),gap=26,pad=24;
  /* Se prueban varias formas (óvalo ancho, círculo, óvalo alto) y se elige la que menos hay que reducir para que quepa. */
  function resolver(ratio){
    let r=110,pts=[],rects=[];
    for(let it=0;it<900;it++){
      const rx=r*ratio,ry=r;
      pts=cards.map((_,k)=>{const an=(-90+k*360/n)*Math.PI/180;return{x:rx*Math.cos(an),y:ry*Math.sin(an)}});
      rects=pts.map((q,k)=>({x:q.x-sizes[k].w/2,y:q.y-sizes[k].h/2,w:sizes[k].w,h:sizes[k].h}));
      const todos=[{x:-cw/2,y:-ch/2,w:cw,h:ch}].concat(rects);
      let ok=true;
      for(let i=0;i<todos.length&&ok;i++)for(let j=i+1;j<todos.length;j++)if(esqChocan(todos[i],todos[j],gap)){ok=false;break}
      if(ok)break;

    }
    const all=[{x:-cw/2,y:-ch/2,w:cw,h:ch}].concat(rects);
    const minX=Math.min(...all.map(q=>q.x)),maxX=Math.max(...all.map(q=>q.x+q.w)),minY=Math.min(...all.map(q=>q.y)),maxY=Math.max(...all.map(q=>q.y+q.h));

  center.style.left=(-cw/2+ox)+'px';center.style.top=(-ch/2+oy)+'px';
  cards.forEach((c,k)=>{

  stage.classList.add('laid');
}

      let pool=state.cards.filter(x=>x.id!==c.id && x.back.trim() && x.materiaId===c.materiaId);
      if(pool.length<3){
        const extra=state.cards.filter(x=>x.id!==c.id && x.back.trim() && x.materiaId!==c.materiaId);
        pool=pool.concat(shuffle(extra).slice(0,3-pool.length));
      }
      const distractors=shuffle(pool).slice(0,3).map(x=>x.back);
      const opts=shuffle([c.back,...distractors]);
      return{card:c,options:opts,selected:null};
    });
    toolState={questions,idx:0,score:0};
  }else if(tool==='comparar'){
    const other=state.materias.find(m=>m.id!==materiaId);
    toolState={materiaId2:other?other.id:null};
  }else{
    toolState={};
  }
  route={view:'tool',tool,materiaId};
  render();
  if(tool==='repaso'){
    toolState.secondsLeft=300;
    repasoTimer=setInterval(()=>{
      toolState.secondsLeft--;
      const el=$('repasoTimerText');
      if(el)el.textContent=fmtSecs(toolState.secondsLeft);
      if(toolState.secondsLeft<=0){clearRepasoTimer();render();}
    },1000);
  }
}

function toolQuizHTML(isExam){
  const{questions,idx,score}=toolState;
  if(!questions.length)return'<div class="empty">Necesitás al menos 2 tarjetas con frente y reverso en esta materia para generar preguntas.</div>';
  const instante=!isExam||examInstantaneo;     // el quiz siempre muestra la respuesta; el examen solo si se activa
  if(idx>=questions.length){
    const pct=Math.round(score/questions.length*100);
    const tono=pct>=70?'alto':pct>=40?'medio':'bajo';
    const msg=pct===100?'¡Perfecto! 🤩':pct>=70?'¡Excelente trabajo! 🎉':pct>=40?'Vas bien, un repaso más y lo logras 💪':'Cada intento cuenta. ¡Repasa y vuelve a probar! 🌱';
    return `<div class="empty resultado">
    <h2>${isExam?'📝':'❓'} ¡Listo!</h2>
    <div class="ringWrap ${tono}"><svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="rbg" cx="60" cy="60" r="52"/><circle class="rfg" cx="60" cy="60" r="52" style="--p:${pct}"/></svg>
      <div class="ringTxt"><b class="countUp" data-to="${score}">${score}</b><span>/ ${questions.length}</span></div></div>
    <p class="resMsg">${msg}</p>
    <p class="meta">Resultado: <b>${score} / ${questions.length}</b> · ${pct}%</p>
    ${premiosHTML()}
    ${isExam?`<div class="resList">${questions.map((q,i)=>`<p class="meta resRow ${q.selected===q.card.back?'bien':'mal'}" style="--i:${Math.min(i,14)}">${i+1}. ${esc(q.card.front)} — ${q.selected===q.card.back?'✅':'❌ correcta: '+esc(q.card.back)}</p>`).join('')}</div>`:''}
    <button class="pr" data-action="redoTool">Repetir</button></div>`;
  }
  const q=questions[idx];
  const contesto=!!q.selected,acierto=contesto&&q.selected===q.card.back;
  const prog0=Math.round(idx/questions.length*100),prog1=Math.round((idx+(contesto?1:0))/questions.length*100);
  const combo=toolState.combo||0;
  return `
  <div class="viewhead"><h1>${isExam?'📝 Modo examen':'❓ Quiz'}</h1><span class="meta">${idx+1} / ${questions.length}</span></div>
  <div class="bar qbar"><i style="width:${prog1}%;--from:${prog0}%"></i></div>
  ${isExam?`<button type="button" class="toggleChip ${examInstantaneo?'on':''}" data-action="toggleInstante" ${contesto?'disabled':''}>⚡ Ver si acerté al instante: ${examInstantaneo?'Sí':'No'}</button>`:''}
  ${instante&&combo>=2?`<div class="comboChip">🔥 ${combo} seguidas</div>`:''}
  <div class="card qCard ${contesto?'answered':''}"><h3 style="margin-top:0">${esc(q.card.front)}</h3>
    ${q.options.map(o=>{
      let cls='sec optBtn';
      if(instante&&contesto){
        if(o===q.card.back)cls+=' ok '+(acierto?'pop':'reveal');
        else if(o===q.selected)cls+=' no shake';
      }else if(!instante&&o===q.selected){
        cls+=' chosen picked';
      }
      return `<button class="${cls}" data-action="answerQuiz" data-opt="${esc(o)}" ${contesto?'disabled':''}>${esc(o)}</button>`;
    }).join('')}
  </div>
  ${instante&&contesto?feedbackHTML(acierto,q,idx):''}
  ${contesto?`<button class="pr nextBtn" data-action="nextQuestion">${idx+1>=questions.length?'Ver resultado →':'Siguiente →'}</button>`:''}`;
}

  const first=new Date(y,m,1),startOff=(first.getDay()+6)%7,daysInMonth=new Date(y,m+1,0).getDate();

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  e.preventDefault();
  const a=b.dataset.action;

  if(a==='addSemester'){
    const name=prompt('Nombre del semestre (ej. Semestre 1, 2026-1):');
    if(name&&name.trim())mutate(s=>s.semesters.push({id:uid(),name:name.trim()}));
  }
  else if(a==='renameSemester'){
    const cur=state.semesters.find(x=>x.id===b.dataset.id);
    const name=prompt('Nuevo nombre del semestre:',cur?cur.name:'');
    if(name&&name.trim())mutate(s=>{const x=s.semesters.find(y=>y.id===b.dataset.id);if(x)x.name=name.trim()});
  }
  else if(a==='renameMateria'){
    const cur=state.materias.find(x=>x.id===b.dataset.id);
    const name=prompt('Nuevo nombre de la materia:',cur?cur.name:'');
    if(name&&name.trim()){
      const icon=prompt('Emoji (opcional):',cur?cur.icon:'📘')||(cur?cur.icon:'📘');
      mutate(s=>{const x=s.materias.find(y=>y.id===b.dataset.id);if(x){x.name=name.trim();x.icon=icon}});
    }
  }
  else if(a==='delSemester'){
    if(confirm('¿Eliminar este semestre y todas sus materias, temas y cortes? Esta acción no se puede deshacer.')){
      state.materias.filter(m=>m.semesterId===b.dataset.id&&m.sharedId).forEach(m=>abandonarCompartida(m,{silent:true}));
      mutate(s=>{
        const matIds=s.materias.filter(m=>m.semesterId===b.dataset.id).map(m=>m.id);
        s.materias=s.materias.filter(m=>m.semesterId!==b.dataset.id);
        s.temas=s.temas.filter(t=>!matIds.includes(t.materiaId));
        s.cortes=s.cortes.filter(c=>!matIds.includes(c.materiaId));
        s.cards=s.cards.filter(c=>!matIds.includes(c.materiaId));
        s.attempts=s.attempts.filter(x=>!matIds.includes(x.materiaId));
        s.semesters=s.semesters.filter(x=>x.id!==b.dataset.id);
      });
    }
  }
  else if(a==='addMateria'){
    const name=prompt('Nombre de la materia:');
    if(name&&name.trim()){
      const icon=prompt('Emoji para la materia (opcional):','📘')||'📘';
      mutate(s=>s.materias.push({id:uid(),name:name.trim(),icon,semesterId:b.dataset.sem,refs:''}));
    }
  }
  else if(a==='delMateria'){
    const msh=state.materias.find(x=>x.id===b.dataset.id);
    if(confirm(msh&&msh.rol==='docente'?'Vas a eliminar esta materia PARA TODOS: tus estudiantes dejarán de recibirla y se borrará el contenido de la nube (ellos conservan una copia local de lo que ya tenían). ¿Continuar?':msh&&msh.sharedId?'Esta materia es compartida: se eliminará de TU cuaderno y saldrás del grupo. Las demás personas conservan todo. ¿Continuar?':'¿Eliminar esta materia y todo su contenido (temas, tarjetas y cortes)? Esta acción no se puede deshacer.')){
      if(msh&&msh.sharedId)abandonarCompartida(msh,{silent:true,todos:msh.rol==='docente'});
      mutate(s=>{
        s.cards=s.cards.filter(c=>c.materiaId!==b.dataset.id);
        s.attempts=s.attempts.filter(x=>x.materiaId!==b.dataset.id);
        s.temas=s.temas.filter(t=>t.materiaId!==b.dataset.id);

  }

  else if(a==='logout'){if(confirm('¿Cerrar sesión?'))auth.signOut();}

/* Hecho por Sebastián Poveda y Santiago Romero. 2026 · generación de temas con IA */
/* ================= IA: SUBIR PDF/PPTX Y GENERAR TEMA + TARJETAS ================= */
/* Caché de resultados de IA: si subes otra vez el mismo archivo, se reutiliza el resultado
   y NO se gasta una petición del límite diario de Gemini (que cuenta peticiones, no tokens). */
const IA_CACHE_VER='v4';   // súbela cada vez que cambies las instrucciones de la IA, para no reutilizar resultados viejos
const IA_CACHE_MAX=15;     // cuántos resultados se recuerdan en este navegador
async function iaHash(texto){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(IA_CACHE_VER+'|'+String(texto).trim().slice(0,60000)));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return null}
}
function iaCacheLeer(){try{return JSON.parse(localStorage.getItem('iaCache')||'{}')||{}}catch(e){return{}}}
async function iaCacheGet(texto){
  const k=await iaHash(texto);if(!k)return null;
  const e=iaCacheLeer()[k];
  return e&&e.d&&e.v===IA_CACHE_VER?e.d:null;
}
async function iaCacheSet(texto,data){
  const k=await iaHash(texto);if(!k)return;
  const c=iaCacheLeer();c[k]={t:Date.now(),v:IA_CACHE_VER,d:data};
  Object.keys(c).sort((a,b)=>c[b].t-c[a].t).slice(IA_CACHE_MAX).forEach(x=>delete c[x]);
  try{localStorage.setItem('iaCache',JSON.stringify(c))}catch(e){/* sin espacio: no pasa nada */}
}
async function extraerTextoPDF(file){
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let texto='';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    texto+=content.items.map(it=>it.str).join(' ')+'\n\n';
  }
  return texto.trim();
}
async function extraerTextoPPTX(file){
  const zip=await JSZip.loadAsync(file);
  const slideFiles=Object.keys(zip.files)
    .filter(name=>/^ppt\/slides\/slide\d+\.xml$/.test(name))
    .sort((a,b)=>{
      const na=+a.match(/slide(\d+)\.xml/)[1], nb=+b.match(/slide(\d+)\.xml/)[1];
      return na-nb;
    });
  let texto='';
  for(const name of slideFiles){
    const xml=await zip.files[name].async('text');
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    const nodes=doc.getElementsByTagName('a:t');
    texto+=Array.from(nodes).map(n=>n.textContent).join(' ')+'\n\n';
  }
  return texto.trim();
}

document.addEventListener('change',async e=>{
  if(e.target.id!=='iaFileInput')return;
  const file=e.target.files[0];
  if(!file)return;
  const materiaId=e.target.dataset.mat;
  const statusEl=$('iaStatus');
  const btn=$('iaUploadBtn');
  const nombre=file.name.toLowerCase();

  try{
    btn.disabled=true;
    statusEl.textContent='📄 Leyendo el archivo…';
    let texto='';
    if(nombre.endsWith('.pdf')) texto=await extraerTextoPDF(file);
    else if(nombre.endsWith('.pptx')) texto=await extraerTextoPPTX(file);
    else{ statusEl.textContent='❌ Solo se admiten archivos .pdf o .pptx.'; btn.disabled=false; return; }

    if(!texto||texto.trim().length<40){
      statusEl.textContent='❌ No pude sacar texto de ese archivo. Si es un PDF escaneado (una foto de las hojas) todavía no lo puedo leer, solo PDFs con texto real.';
      btn.disabled=false; return;
    }

    const materia=state.materias.find(m=>m.id===materiaId);
    if(state.temas.some(t=>t.materiaId===materiaId&&t.fuente===file.name)&&!confirm('Ya hay un tema creado a partir de un archivo llamado "'+file.name+'". ¿Subirlo de todos modos?')){statusEl.textContent='';return}
    let data=await iaCacheGet(texto);
    const desdeCache=!!data;
    if(desdeCache){
      statusEl.textContent='♻️ Ya había analizado este archivo: reutilicé el resultado sin gastar IA.';
    }else{
      statusEl.textContent='🤖 La IA está armando el tema y las tarjetas… puede tardar hasta un minuto.';
      const token=await auth.currentUser.getIdToken();   // prueba de que hay sesión iniciada
      const resp=await fetch('/.netlify/functions/generar-tema',{
        method:'POST',
        headers:{'content-type':'application/json','authorization':'Bearer '+token},
        body:JSON.stringify({texto:texto.slice(0,60000), materia:materia?materia.name:''})
      });
      try{ data=await resp.json(); }catch(e){ data=null; }
      if(!resp.ok||!data){
        statusEl.textContent='❌ '+((data&&data.error)||('El servidor no pudo completar la petición (código '+resp.status+'). Suele pasar cuando la IA tarda demasiado; prueba con un archivo más corto o inténtalo de nuevo.'));
        btn.disabled=false; return;
      }
    }
    if(!data.titulo||!Array.isArray(data.tarjetas)){
      statusEl.textContent='❌ La IA no devolvió un resultado válido. Probá de nuevo.';
      btn.disabled=false; return;
    }
    if(!desdeCache)iaCacheSet(texto,data);

    mutate(s=>{
      const temaId=uid();
      const secs=Array.isArray(data.secciones)?data.secciones.filter(x=>x&&x.titulo&&x.contenido).map(x=>({id:uid(),title:String(x.titulo),body:String(x.contenido),...(()=>{const pr=(Array.isArray(x.puntos)?x.puntos:[]).map((p,i)=>({p:String(p).trim(),t:Array.isArray(x.tipos)?x.tipos[i]:null})).filter(o=>o.p).slice(0,6);return{puntos:pr.map(o=>o.p),tipos:pr.map(o=>ESQ_TIPOS.includes(o.t)?o.t:null)}})()})):[];
      const sel=$('iaCorte');const corteId=(sel&&sel.value)||(s.cortes.find(c=>c.materiaId===materiaId)||{}).id;
      ui.open[corteId]=true;ui.open[temaId]=true;
      const tema={id:temaId,materiaId,corteId,title:data.titulo,body:data.resumen||'',by:miNombre(),fuente:file.name,publicado:(materia&&materia.rol==='docente')?false:undefined,updatedAt:Date.now()};
      if(secs.length)tema.secciones=secs;
      s.temas.unshift(tema);
      (data.tarjetas||[]).forEach(t=>{
        if(t.frente&&t.reverso) s.cards.push({id:uid(),materiaId,temaId,front:t.frente,back:t.reverso,known:null});
      });
    });
    const st=$('iaStatus');
    if(st) st.textContent=`✅ Listo — se creó el tema "${data.titulo}" con ${(data.tarjetas||[]).length} tarjetas.${desdeCache?' (resultado reutilizado, sin gastar IA)':''}`;

/* Hecho por Sebastián Poveda y Santiago Romero. 2026 */
/* ======================================================================
   MATERIAS COMPARTIDAS
   Una materia compartida vive en Firestore como  temarios/{sharedId}
     - documento:           nombre, icono, dueño, miembros
     - subcolección temas:  un documento por tema (con sus tarjetas dentro)
   Cada persona conserva su propia copia local (m.sharedId la enlaza con el grupo).
   Es PERSONAL de cada quien: cortes, notas, calendario y si "sabía" una tarjeta.
   Es COMPARTIDO: temas, secciones, tarjetas y el autor / archivo de origen.
   ====================================================================== */
const SESION=uid();        // distingue mis escrituras de las de otras personas o dispositivos
const sharedLast={};       // temaId -> {sid,k}: último contenido sincronizado (evita reenviar lo que no cambió)
const sharedMeta={};       // sharedId -> datos del documento del grupo
const sharedUnsub={};      // sharedId -> funciones para dejar de escuchar
const sharedFirst={};      // sharedId -> true cuando ya llegó la primera lectura de temas
let pendingRender=false;

const refTemario=sid=>db.collection('temarios').doc(sid);
function miNombre(){
  const u=auth.currentUser;
  return String((state.profile&&state.profile.name)||(u&&u.displayName)||(u&&u.email&&u.email.split('@')[0])||'Alguien').trim();
}
function sharedMateria(materiaId){const m=state.materias.find(x=>x.id===materiaId);return m&&m.sharedId?m:null}
function nMiembros(m){const x=sharedMeta[m.sharedId];return x&&x.members?x.members.length:1}
function msgDelTema(id){
  const t=state.temas.find(x=>x.id===id);
  return t&&sharedMateria(t.materiaId)
    ?'Esta materia es compartida: el tema se eliminará para TODAS las personas del grupo. ¿Continuar?'
    :'¿Eliminar este tema y sus tarjetas?';
}

/* Contenido compartible de un tema (sin nada personal como corteId o "known") */
function contenidoTema(t){
  return{
    publicado:esDocenteMat(t.materiaId)?!!t.publicado:true,
    title:t.title||'',body:t.body||'',
    secciones:Array.isArray(t.secciones)?t.secciones:null,
    by:t.by||'',fuente:t.fuente||'',
    cards:state.cards.filter(c=>c.temaId===t.id).map(c=>({id:c.id,front:c.front||'',back:c.back||''}))
  };
}

/* ---------- Subir mis cambios ---------- */
let pushingShared=false,repushShared=false;
async function pushShared(){
  if(!currentUid)return;
  if(pushingShared){repushShared=true;return}
  pushingShared=true;
  try{
    for(const m of state.materias.filter(x=>x.sharedId)){
      try{await pushSharedMateria(m,false)}
      catch(e){console.error('No se pudo sincronizar "'+m.name+'":',e)}
    }
  }finally{
    pushingShared=false;
    if(repushShared){repushShared=false;pushShared()}
  }
}
/* force=true solo al compartir una materia que ya existía: sube todo lo que hay antes de escuchar */
async function pushSharedMateria(m,force){
  const sid=m.sharedId;
  if(m.rol==='estudiante')return;              // el estudiante nunca escribe contenido
  if(!force&&!sharedFirst[sid])return;       // hasta no ver lo que ya hay en la nube, no se escribe nada
  if(m.rol==='docente'&&sharedMeta[sid]&&(sharedMeta[sid].name!==m.name||(sharedMeta[sid].icon||'')!==(m.icon||'')))
    await refTemario(sid).update({name:m.name,icon:m.icon||'📘'});
  const base=refTemario(sid).collection('temas');
  const temas=state.temas.filter(t=>t.materiaId===m.id);
  const ids=new Set(temas.map(t=>t.id));
  const ops=[],hechos={},borrados=[];
  temas.forEach(t=>{
    const c=contenidoTema(t),k=JSON.stringify(c);
    if(sharedLast[t.id]&&sharedLast[t.id].k===k)return;
    const data=JSON.parse(JSON.stringify({...c,updatedAt:t.updatedAt||Date.now(),sess:SESION,editor:currentUid}));
    ops.push(b=>b.set(base.doc(t.id),data));
    hechos[t.id]=k;
  });
  Object.keys(sharedLast).forEach(id=>{
    if(sharedLast[id].sid===sid&&!ids.has(id)){ops.push(b=>b.delete(base.doc(id)));borrados.push(id)}
  });
  for(let i=0;i<ops.length;i+=400){
    const batch=db.batch();
    ops.slice(i,i+400).forEach(f=>f(batch));
    await batch.commit();
  }
  Object.keys(hechos).forEach(id=>{sharedLast[id]={sid,k:hechos[id]}});
  borrados.forEach(id=>delete sharedLast[id]);
}

/* ---------- Recibir cambios de otras personas ---------- */
function aplicarTemaRemoto(m,id,d){
  let t=state.temas.find(x=>x.id===id);
  if(!t){t={id,materiaId:m.id,corteId:null};state.temas.unshift(t)}
  t.materiaId=m.id;
  t.title=d.title||'';t.body=d.body||'';t.by=d.by||'';t.fuente=d.fuente||'';
  if(typeof d.publicado==='boolean')t.publicado=d.publicado;else delete t.publicado;
  if(Array.isArray(d.secciones))t.secciones=d.secciones;else delete t.secciones;
  t.updatedAt=d.updatedAt||Date.now();
  const viejas=new Map(state.cards.filter(c=>c.temaId===id).map(c=>[c.id,c]));
  state.cards=state.cards.filter(c=>c.temaId!==id);
  (d.cards||[]).forEach(c=>state.cards.push({
    id:c.id,temaId:id,materiaId:m.id,front:c.front||'',back:c.back||'',
    known:viejas.has(c.id)?viejas.get(c.id).known:null     // "sabía esta tarjeta" es solo mío
  }));
  sharedLast[id]={sid:m.sharedId,k:JSON.stringify(contenidoTema(t))};
}
function quitarTemaLocal(id){
  state.temas=state.temas.filter(t=>t.id!==id);
  state.cards=state.cards.filter(c=>c.temaId!==id);
  delete sharedLast[id];
}
/* Repinta sin interrumpir: si estoy escribiendo, espera a que suelte el campo */
function renderSeguro(){
  if(!['materias','materiaDetail','perfil','docente','logros'].includes(route.view))return;
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('textarea,input,select')&&$('view').contains(a)){pendingRender=true;return}
  render(true);
}
document.addEventListener('focusout',()=>{
  if(!pendingRender)return;
  setTimeout(()=>{
    const a=document.activeElement;
    if(a&&a.matches&&a.matches('textarea,input,select')&&$('view').contains(a))return;
    pendingRender=false;renderSeguro();
  },150);
});

function escucharCompartida(m){
  const sid=m.sharedId;
  if(!sid||sharedUnsub[sid])return;
  const fallo=err=>{
    console.error('Materia compartida:',err);
    if(err&&(err.code==='permission-denied'||err.code==='not-found'))
      desvincularCompartida(sid,'Ya no tienes acceso a la materia compartida "'+m.name+'". Conservas una copia en tu cuaderno que ya no se sincroniza.');
  };
  const u1=refTemario(sid).onSnapshot(snap=>{
    if(!snap.exists||(snap.data()||{}).eliminado){
      desvincularCompartida(sid,'La materia compartida "'+m.name+'" fue eliminada por quien la creó. Conservas una copia en tu cuaderno que ya no se sincroniza.');
      return;
    }
    sharedMeta[sid]=snap.data();
    const loc=state.materias.find(x=>x.sharedId===sid);
    if(loc&&loc.rol==='estudiante'&&(loc.name!==sharedMeta[sid].name||loc.icon!==sharedMeta[sid].icon)){loc.name=sharedMeta[sid].name;loc.icon=sharedMeta[sid].icon||'📘';saveLocal()}
    renderSeguro();
  },fallo);
  const colTemas=refTemario(sid).collection('temas');
  const u2=(m.rol==='estudiante'?colTemas.where('publicado','==',true):colTemas).onSnapshot(snap=>{
    const mat=state.materias.find(x=>x.sharedId===sid);
    if(!mat)return;
    let cambio=false;
    if(!sharedFirst[sid]){
      /* Primera lectura: lo que hay en la nube manda. Se descarta lo local que ya no existe allá. */
      const remotos=new Set(snap.docs.map(d=>d.id));
      const viejos=state.temas.filter(t=>t.materiaId===mat.id&&!remotos.has(t.id)).map(t=>t.id);
      viejos.forEach(quitarTemaLocal);
      snap.docs.forEach(d=>aplicarTemaRemoto(mat,d.id,d.data()));
      sharedFirst[sid]=true;cambio=true;
    }else{
      snap.docChanges().forEach(ch=>{
        if(ch.doc.metadata.hasPendingWrites)return;                    // es mi propio cambio todavía en camino
        if(ch.type==='removed'){
          if(sharedMeta[sid]&&sharedMeta[sid].eliminado)return;        // el grupo se está borrando: conservo mi copia
          quitarTemaLocal(ch.doc.id);cambio=true;
        }else{
          const d=ch.doc.data();
          if(d.sess===SESION)return;                                   // lo escribí yo en esta sesión
          aplicarTemaRemoto(mat,ch.doc.id,d);cambio=true;
        }
      });
    }
    if(cambio){ensureCortes();saveLocal();renderSeguro()}
  },fallo);
  sharedUnsub[sid]=[u1,u2];
  if(m.rol==='docente')sharedUnsub[sid].push(escucharInvitaciones(sid));
}
function detener(sid){
  (sharedUnsub[sid]||[]).forEach(f=>{try{f()}catch(e){}});
  delete sharedUnsub[sid];delete sharedFirst[sid];delete sharedMeta[sid];delete invitMap[sid];
}
function olvidarTemas(sid){Object.keys(sharedLast).forEach(id=>{if(sharedLast[id].sid===sid)delete sharedLast[id]})}
function startShared(){stopShared();state.materias.filter(m=>m.sharedId).forEach(escucharCompartida)}
function stopShared(){
  Object.keys(sharedUnsub).forEach(detener);Object.keys(sharedLast).forEach(k=>delete sharedLast[k]);
  if(invitesUnsub){invitesUnsub();invitesUnsub=null}
  invitesPend=[];
}

/* La materia deja de estar enlazada al grupo pero la copia local se conserva */
function desvincularCompartida(sid,aviso){
  detener(sid);olvidarTemas(sid);
  state.materias.forEach(m=>{if(m.sharedId===sid)hacerLocal(m)});
  saveLocal();scheduleCloud();renderSeguro();
  if(aviso)setTimeout(()=>alert(aviso),50);
}

/* ---------- Crear, compartir, unirse, salir ---------- */
async function crearCompartida(semId){
  const name=prompt('Nombre de la materia compartida (ej. Ética con Santiago):');
  if(!name||!name.trim())return;
  const icon=prompt('Emoji (opcional):','📘')||'📘';
  const ref=db.collection('temarios').doc();
  try{
    await ref.set({name:name.trim(),icon,ownerUid:currentUid,members:[currentUid],
      memberNames:{[currentUid]:miNombre()},createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){console.error(e);alert('No se pudo crear la materia compartida. Revisa las reglas de Firestore y tu conexión.');return}
  mutate(s=>s.materias.push({id:uid(),name:name.trim(),icon,semesterId:semId,refs:'',sharedId:ref.id}));
  const m=state.materias.find(x=>x.sharedId===ref.id);
  escucharCompartida(m);
  route={view:'materiaDetail',materiaId:m.id};render();
}
async function compartirMateria(m){
  if(m.sharedId)return;
  const ref=db.collection('temarios').doc();
  try{
    await ref.set({name:m.name,icon:m.icon||'📘',ownerUid:currentUid,members:[currentUid],
      memberNames:{[currentUid]:miNombre()},createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    m.sharedId=ref.id;
    await pushSharedMateria(m,true);            // sube los temas que ya tenías antes de empezar a escuchar
  }catch(e){
    console.error(e);delete m.sharedId;olvidarTemas(ref.id);
    alert('No se pudo compartir la materia. Revisa las reglas de Firestore y tu conexión.');return;
  }
  persist();escucharCompartida(m);render(true);
}
async function unirseCompartida(codigo){
  codigo=String(codigo||'').trim();
  const enlace=codigo.match(/[?&]unirse=([A-Za-z0-9]+)/);if(enlace)codigo=enlace[1];
  if(!/^[A-Za-z0-9]{10,40}$/.test(codigo)){alert('Ese código no es válido. Pídele a tu compañero que te lo envíe de nuevo.');return}
  const ya=state.materias.find(x=>x.sharedId===codigo);
  if(ya){route={view:'materiaDetail',materiaId:ya.id};render();return}
  try{
    const ref=refTemario(codigo),F=firebase.firestore.FieldValue;
    await ref.update({members:F.arrayUnion(currentUid),['memberNames.'+currentUid]:miNombre()});
    const d=(await ref.get()).data();
    mutate(s=>{
      s.materias.push({id:uid(),name:d.name,icon:d.icon||'📘',semesterId:semVisible(s).id,refs:'',sharedId:codigo});
    });
    const m=state.materias.find(x=>x.sharedId===codigo);
    escucharCompartida(m);
    route={view:'materiaDetail',materiaId:m.id};render();
  }catch(e){
    console.error(e);
    alert('No encontré esa materia compartida o no tienes permiso para entrar. Revisa que el código esté completo.');
  }
}
async function abandonarCompartida(m,opts){
  opts=opts||{};
  const sid=m.sharedId;if(!sid)return;
  const eraDocente=m.rol==='docente';
  const meta=sharedMeta[sid]||{};
  const soyDueno=meta.ownerUid===currentUid;
  const soyUltimo=Array.isArray(meta.members)&&meta.members.length<=1;
  detener(sid);olvidarTemas(sid);
  hacerLocal(m);                                // desde aquí ya no se sincroniza nada de esta materia
  try{
    if((opts.todos&&soyDueno)||soyUltimo){
      const ref=refTemario(sid);
      if(!soyUltimo){                           // avisa primero para que los demás conserven su copia
        await ref.update({eliminado:true});
        await new Promise(r=>setTimeout(r,1500));
      }
      const qs=await ref.collection('temas').get();
      for(let i=0;i<qs.docs.length;i+=400){
        const b=db.batch();qs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();
      }
      if(eraDocente)await borrarInvitaciones(sid);
      await ref.delete();
    }else{
      const F=firebase.firestore.FieldValue;
      await refTemario(sid).update({members:F.arrayRemove(currentUid),['memberNames.'+currentUid]:F.delete()});
    }
  }catch(e){
    console.error(e);
    if(!opts.silent)alert('Saliste de la materia en tu cuaderno, pero no se pudo avisar a la nube: '+e.message);
  }
}

});


/* ======================================================================
   ESPACIO DOCENTE
   - Una materia de docente es un temario con tipo:'docente' (Firestore: temarios/{id}).
   - El docente es el único que escribe. Cada tema tiene publicado:true/false.
   - Los estudiantes entran por INVITACIÓN a su correo (colección invitaciones/{sid}_{correo}),
     ven solo los temas publicados y el contenido es de solo lectura para ellos.
   - En el cuaderno de cada persona: m.rol = 'docente' | 'estudiante'.
     Las materias de docente viven en un semestre oculto ('sem-docente') para no mezclarse
     con las materias del estudiante.
   ====================================================================== */
const invitMap={};        // sid -> invitaciones que envié como docente
let invitesPend=[];       // invitaciones pendientes dirigidas a mi correo
let invitesUnsub=null;

function esDocenteMat(materiaId){const m=state.materias.find(x=>x.id===materiaId);return !!(m&&m.rol==='docente')}
function nombreDocente(m){const x=sharedMeta[m.sharedId];return x?((x.memberNames||{})[x.ownerUid]||'tu docente'):'tu docente'}
function semDocente(s){
  let x=s.semesters.find(y=>y.id==='sem-docente');
  if(!x){x={id:'sem-docente',name:'Docente',oculto:true};s.semesters.push(x)}
  return x;
}
function semVisible(s){
  const v=s.semesters.filter(x=>!x.oculto);
  if(v.length)return v[v.length-1];
  const n={id:uid(),name:'Semestre 1'};s.semesters.push(n);return n;
}
/* Deja de estar enlazada al grupo pero se conserva como materia normal y editable */
function hacerLocal(m){
  delete m.sharedId;delete m.rol;
  if(state.semesters.some(x=>x.id===m.semesterId&&x.oculto))m.semesterId=semVisible(state).id;
}

  }catch(e){console.error(e);alert('No se pudo crear la materia'+detalleError(e)+'. Revisa las reglas de Firestore y tu conexión.');return}
  mutate(s=>s.materias.push({id:uid(),name:name.trim(),icon,semesterId:semDocente(s).id,refs:'',sharedId:ref.id,rol:'docente'}));

}

function escucharInvitaciones(sid){

async function invitarEstudiantes(m){
  const box=$('invEmails');if(!box)return;
  const crudos=[...new Set(box.value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];
  const valido=e=>/^[^\s@\/\\]+@[^\s@\/\\]+\.[^\s@\/\\]+$/.test(e);
  const buenos=crudos.filter(valido),malos=crudos.filter(e=>!valido(e));
  const yo=(auth.currentUser.email||'').toLowerCase();
  const existentes=new Set((invitMap[m.sharedId]||[]).map(i=>i.email));
  const nuevos=buenos.filter(e=>e!==yo&&!existentes.has(e));
  if(!nuevos.length){alert(malos.length?'Estos correos no son válidos: '+malos.join(', '):'No hay correos nuevos para invitar.');return}
  try{
    for(let i=0;i<nuevos.length;i+=400){
      const b=db.batch();
      nuevos.slice(i,i+400).forEach(email=>b.set(db.collection('invitaciones').doc(m.sharedId+'_'+email),{
        sid:m.sharedId,email,materia:m.name,icon:m.icon||'📘',docente:miNombre(),ownerUid:currentUid,
        estado:'pendiente',createdAt:firebase.firestore.FieldValue.serverTimestamp()}));
      await b.commit();
    }
    box.value='';
    alert('Invitaciones enviadas a '+nuevos.length+' persona'+(nuevos.length==1?'':'s')+'.'+(malos.length?'\nNo válidos (se omitieron): '+malos.join(', '):''));
  }catch(e){console.error(e);alert('No se pudieron enviar las invitaciones'+detalleError(e)+'. Si dice permission-denied, falta publicar las reglas nuevas de Firestore.')}
}
async function quitarInvitacion(m,invId){
  const inv=(invitMap[m.sharedId]||[]).find(x=>x.id===invId);if(!inv)return;
  if(!confirm(inv.uid?'¿Quitar a '+(inv.nombre||inv.email)+' de la materia? Conservará una copia de lo que ya tenía, pero ya no recibirá más cambios.':'¿Cancelar la invitación a '+inv.email+'?'))return;
  try{
    if(inv.uid){const F=firebase.firestore.FieldValue;
      await refTemario(m.sharedId).update({members:F.arrayRemove(inv.uid),['memberNames.'+inv.uid]:F.delete()})}
    await db.collection('invitaciones').doc(invId).delete();
  }catch(e){console.error(e);alert('No se pudo completar la acción.')}
}
async function borrarInvitaciones(sid){
  const qs=await db.collection('invitaciones').where('sid','==',sid).where('ownerUid','==',currentUid).get();
  for(let i=0;i<qs.docs.length;i+=400){
    const b=db.batch();qs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();
  }
}
