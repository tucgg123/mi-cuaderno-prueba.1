<body>
<div class="fx" aria-hidden="true"></div>

<!-- Hecho por Sebastián Poveda y Santiago Romero. 2026 · pantalla de acceso -->
<div id="authScreen">
  <div class="authCard">
    <h1 class="brand"><svg width="32" height="32" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="6" width="16" height="20" rx="4" fill="#7FB3E6"/><rect x="6" y="3" width="16" height="20" rx="4" fill="#8ED1A4"/><rect x="10" y="6" width="16" height="20" rx="4" fill="#E9A58C"/></svg>Auren</h1>
    <p class="meta">Organiza las materias y temas de tu carrera. Tus datos quedan guardados en tu cuenta.</p>
    <div class="sys"><i></i>conexión cifrada</div>
    <button type="button" class="googleBtn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <div class="authSep">o con tu correo</div>
    <div class="authTabs">
      <button class="on" data-authtab="login" type="button">Iniciar sesión</button>
      <button data-authtab="register" type="button">Crear cuenta</button>
    </div>
    <form id="authForm">
      <input id="authEmail" type="email" placeholder="Correo electrónico" required autocomplete="email">
      <input id="authPass" type="password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6" autocomplete="current-password">
      <button class="pr" type="submit" id="authSubmit">Iniciar sesión</button>
    </form>
    <p id="authError" class="authError" hidden></p>
    <p id="authLoading" class="meta" hidden>Conectando…</p>
  </div>
</div>

<!-- Hecho por Sebastián Poveda y Santiago Romero. 2026 · aplicación -->
<div id="appRoot" hidden>
  <header id="topbar">
    <b id="ct">📚 Auren</b>
    <div id="searchWrap">
      <input id="searchBox" placeholder="Buscar materia o tema…">
      <div id="searchResults"></div>
    </div>
    <button id="bellBtn" class="icon-btn bellBtn" title="Avisos" aria-label="Avisos" aria-haspopup="dialog">🔔<span id="bellN" class="bellN" hidden></span></button>
    <button id="themeBtn" class="icon-btn" title="Cambiar tema"></button>
    <button id="logoutBtn" class="icon-btn" title="Cerrar sesión">🚪</button>
  </header>
  <div id="avisosPanel" class="avisosPanel" role="dialog" aria-label="Avisos" hidden></div>
  <nav id="mainNav">
    <button data-nav="materias" class="on">📚 Materias</button>
    <button data-nav="docente">👩‍🏫 Docente</button>
    <button data-nav="calendario">🗓️ Calendario</button>
    <button data-nav="logros">🏆 Logros</button>
    <button data-nav="perfil">👤 Perfil</button>
  </nav>
  <main id="view"></main>
</div>
